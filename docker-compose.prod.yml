services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: familyguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: familyguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyguard -d familyguard"]
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
      - "5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://familyguard:${POSTGRES_PASSWORD}@db:5432/familyguard
      DATABASE_URL_SYNC: postgresql://familyguard:${POSTGRES_PASSWORD}@db:5432/familyguard
      START_NGROK: "0"
      MEDIA_DIR: /app/uploads
    volumes:
      - media:/app/uploads
      - ./public:/app/public:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TLS_EMAIL: ${TLS_EMAIL:-admin@khasanoff.uz}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
