services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: familyguard
      POSTGRES_PASSWORD: familyguard
      POSTGRES_DB: familyguard
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyguard -d familyguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
